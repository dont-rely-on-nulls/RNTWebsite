# The deploy workflow overrides baseURL with the GitHub Pages URL.
baseURL = "https://example.org/"
locale = "en"
title = "RNT — Relations, Not Tables"
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "RNT is an experimental database kernel modeled on Windows NT. Query languages live on top as environment subsystems."
  ground = "#64659F"
  sourceURL = "#"
  docsURL = "#"
  licenseURL = "https://www.gnu.org/licenses/agpl-3.0.html"

[markup.highlight]
  noClasses = false

# Home page sections live under content/home: they are read by the home
# template and never rendered as pages of their own.
[[cascade]]
  [cascade.build]
    render = "never"
    list = "local"
  [cascade.target]
    path = "{/home,/home/**}"

[menus]
  [[menus.main]]
    name = "Architecture"
    url = "#architecture"
    weight = 1
  [[menus.main]]
    name = "Subsystems"
    url = "#subsystems"
    weight = 2
  [[menus.main]]
    name = "Applications"
    url = "#applications"
    weight = 3
  [[menus.main]]
    name = "Object tree"
    url = "#object-tree"
    weight = 4
  [[menus.main]]
    name = "Kernel"
    url = "#kernel"
    weight = 5
